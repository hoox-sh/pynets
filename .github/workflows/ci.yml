name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck
        timeout-minutes: 5

      - name: Test (coverage)
        run: bun test --coverage --coverage-reporter=lcov --coverage-reporter=text --coverage-dir=coverage
        timeout-minutes: 10
        env:
          NO_COLOR: "1"

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage/lcov.info
          flags: unit
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build Node / browser bundles
        run: bun run build
        timeout-minutes: 5

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Node bundle smoke
        run: |
          node --input-type=module -e '
          import { parse, Runtime } from "./dist/index.js";
          const src = "//@version=5\nindicator(\"t\")\nplot(close)";
          if (parse(src).kind !== "Script") throw new Error("parse");
          const out = new Runtime("T").run(src, [{ close: 1 }, { close: 2 }]);
          if (out.plots[1] !== 2) throw new Error(String(out.error ?? out.plots));
          console.log("node bundle ok");
          '

      - name: Pack dry-run
        run: npm pack --dry-run
