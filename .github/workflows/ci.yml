name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck
        timeout-minutes: 5

      - name: Test
        run: bun test
        timeout-minutes: 10
        env:
          NO_COLOR: "1"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pack dry-run
        run: npm pack --dry-run
