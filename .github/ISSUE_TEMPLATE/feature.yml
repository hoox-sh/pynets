name: Feature request
description: A builtin or host hook that Python already has
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: request
    attributes:
      label: Request
      description: Name the Python handler or Pine builtin. Interpret only — no compile/Worker asks.
    validations:
      required: true
  - type: textarea
    id: python
    attributes:
      label: Python SoT
      description: Path or snippet in pynescript if you have it.
