name: Bug report
description: Something interpret, parse, or the CLI does wrong
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security issues: do not file a public bug. Use GitHub Security Advisories
        (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Actual vs expected. Python pynescript.runtime wins if they disagree.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal Pine snippet, bars, and the command or Runtime.run call.
      render: pine
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "@hoox/pynets 0.1.0 / git SHA"
